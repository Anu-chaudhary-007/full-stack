<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard layout</title>
  <style>
    .container {
      display: flex;
      flex-wrap: wrap;
    }
    .sidebar {
      background-color: black;
      width: 200px;
      height: 100vh;
      color: white;
    }
    .navbar {
      background-color: rgb(182, 182, 203);
      width: 100%;
      height: 100px;
      text-align: center;
      line-height: 100px;
    }
    .box {
      background-color: gray;
      margin: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="navbar">
        <h2>DASHBOARD OVERVIEW</h2>
      </div>
      <div class="box" id="box1"><p>1</p></div>
      <div class="box" id="box2"><p>2</p></div>
      <div class="box" id="box3"><p>3</p></div>
    </div>
  </div>
</body>
</html>

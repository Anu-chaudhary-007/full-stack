<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .root{
            --primary-color:grey;

        }
        .container{
            height:500px;
            width:500px;
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
           grid-template-rows: 1fr 1fr 1fr;
            outline:1px solid black;

           /* grid-template-areas: 
            "box1 box1 box2"
            "box1 box1 box3"
            "box4 box5 box6"
            "box7 box5 box6";*/
        }
        .container>div{
            outline:1px dashed black;
            font-size: 30px;
            text-align: center;

        }
        .parent{
            display:grid;
            background-color: blue;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-row:1/3;
            grid-column:1/3;
                }
        .child{
            background-color:var(--primary-color);
            grid-column:2/3;
            grid-row:2/3;
            color:white;
        }
       /* #box1{
            grid-column-start:1;
            grid-column-end:3;
            grid-row-start: 1;
            grid-row-end: 3;
            z-index:1;
            background-color: white;
        }
       
        #box6{
            background-color: grey;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
            z-index:2;
        }*/
    </style>
</head>
<body>
    <div class="container">
        <div  class="parent"id ="box1" >1</div>
        <div id ="box2" >2</div>
        <div id ="box3" >3</div>
        <div id ="box4" >4</div>
        <div id ="box5" >5</div>
        <div class="child" id ="box6" >6</div>
            
        </div>
      
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button{
            background-color: black;
            color: white;
            border-width:0px;
            box-shadow:3px 3px ;
        }
       
        p:hover{
            color:grey;
        }
        button:hover{
           
            box-shadow:3px 3px 5px yellow;;
        }
        button:active{
            background-color: grey;
            box-shadow:0px 0px ;
        }
        input[type=checkbox]{
            height:50px;
            width:50px;
        }
        input:checked{
            
            box-shadow:3px 3px 5px grey ;
            accent-color:red;
        }
        button:focus{
            outline: 3px solid red;
        }
        a{
            font-size:40px;
        }
        a:link{
            color:red;
        }
        a:visited{
            color:grey;
        }
        
       
    </style>
</head>

<body>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Natus ullam libero, voluptate laudantium tempore sint et dolore consequuntur debitis dicta alias, quia quos est neque! Quo laborum delectus corrupti animi.</p>
    <button>Hover over me</button>
    <input type="checkbox"/>
    <a href='#' target="_blank">LINK</a>
    <a href="#6">link</a>
    <a href="4">link</a>
</body>
</html>
